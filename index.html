.hb{min-height:40px}

  let pr;try{pr=await sb.decrypt({name:'AES-GCM',iv:ub(OWNER.iv)},await pk(o,OWNER.salt),ub(OWNER.w))}catch(e){return toast('今のパスワードが違います')}
  try{const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iv=crypto.getRandomValues(new Uint8Array(12)),w=b64(await sb.encrypt({name:'AES-GCM',iv},await pk(n,salt),pr)),nd={pub:OWNER.pub,salt,iv:b64(iv),w};
    await raw.doc('owner/pw').set(nd);OWNER=nd;['#op0','#op1','#op2'].forEach(k=>{$(k).value=''});toast('オーナーのパスワードを変更しました')}catch(e){toast('変更できません。もう一度試してください')}}
const isOwn=()=>!!(STORE.owner||SID==='19891013');
async function ensureStoreKey(){if(STORE.pub)return;const o=await mkPair(SID),r=raw.doc('stores/'+SID);const fin=await raw.runTransaction(async t=>{const d=await t.get(r),x=d.data()||{};if(x.pub)return x;t.update(r,o);return o});STORE={...STORE,...fin}}
const atabs=()=>`<div class="seg"><button class="${AT==='m'?'on':''}" onclick="AT='m';render()">店舗管理</button><button class="${AT==='s'?'on':''}" onclick="openAdminSales()">店舗別売上履歴</button></div>`;

async function loadAllDays(){ALLD=null;H={lvl:'d',key:null,f:'a'};render();try{const out=[];await Promise.all(S.stores.map(async st=>{const sn=await raw.collection('stores/'+st.id+'/days').get();await Promise.all(sn.docs.map(async dd=>{const d={id:dd.id,...dd.data()};let r=d;if(d.ct){try{const x=await unseal(d,OKEY,'kO');r={...d,...x.sl}}catch(e){return}}out.push({...r,_s:st.id,_n:st.name})}))}));ALLD=out}catch(e){ALLD=[];toast('読み込めません')}render()}
function adminSales(){if(!OKEY)return '<div class="empty">もう一度「管理」から開いてください</div>';if(!ALLD)return '<div class="empty">読み込み中…</div>';DD=ALLD.filter(d=>!AS||d._s===AS);return `<div class="ln"><select style="flex:1" onchange="AS=this.value;H.key=null;render()"><option value="">全店舗</option>${S.stores.map(x=>`<option value="${x.id}" ${AS===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button onclick="loadAllDays()">更新</button></div>`+salesView().replace(/^<main>/,'').replace(/<\/main>$/,'')}
let PWC={};
const pwShow=x=>x.pwO?(PWC[x.id]&&PWC[x.id].k===x.pwO?PWC[x.id].v:'読み込み中…'):x.id;

async function decPws(){if(!OKEY||V!=='admin')return;let ch=false;for(const x of S.stores){if(!x.pwO){if(PWC[x.id]){delete PWC[x.id];ch=true}continue}if(PWC[x.id]&&PWC[x.id].k===x.pwO)continue;let v='（読めません）';try{v=TD.decode(await sb.decrypt({name:'RSA-OAEP'},OKEY,ub(x.pwO)))}catch(e){}PWC[x.id]={k:x.pwO,v};ch=true}if(ch&&V==='admin')render()}
async function chgStorePw(bt){const o=$('#sp0').value,n=$('#sp1').value,c=$('#sp2').value;
  if(!o)return toast('現在のパスワードを入力してください');if(n.length<4)return toast('新しいパスワードは4文字以上で入力してください');if(n.length>64)return toast('新しいパスワードは64文字以内にしてください');if(n!==c)return toast('新しいパスワードが一致しません');
  const t0=bt&&bt.textContent;if(bt){bt.disabled=true;bt.textContent='確認中…'}
  try{if(!OL){try{const d=await raw.doc('owner/pw').get();OWNER=d.exists?d.data():null;OL=true}catch(e){return toast('確認できません。通信を確認して、もう一度押してください')}}
    if(!OWNER||!OWNER.pub)return toast('先にオーナーが「オーナー管理」でパスワードを設定してください');
    if(!STORE.pub){if(o!==SID)return toast('現在のパスワードが違います');await ensureStoreKey()}
    let pr;try{pr=await sb.decrypt({name:'AES-GCM',iv:ub(STORE.iv)},await pk(o,STORE.salt),ub(STORE.w))}catch(e){return toast('現在のパスワードが違います')}
    const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iv=crypto.getRandomValues(new Uint8Array(12)),w=b64(await sb.encrypt({name:'AES-GCM',iv},await pk(n,salt),pr)),pwO=b64(await sb.encrypt({name:'RSA-OAEP'},await impPub(OWNER.pub),TE.encode(n))),nd={salt,iv:b64(iv),w,pwO};
    await raw.doc('stores/'+SID).update(nd);STORE={...STORE,...nd};['#sp0','#sp1','#sp2'].forEach(k=>{$(k).value=''});toast('売上履歴のパスワードを変更しました')}
  catch(e){toast('変更できません。もう一度試してください')}finally{if(bt){bt.disabled=false;bt.textContent=t0}}}
async function regStore(){const n=$('#rn').value.trim(),c=String($('#rc').value||'').normalize('NFKC').trim();if(!n)return toast('店舗名を入力してください');if(!/^\d{8}$/.test(c))return toast('店舗コードは8桁の数字で入力してください');busy(1);
  try{const r=raw.doc('stores/'+c);if((await r.get()).exists){busy(0);return toast('その店舗コードはすでに使われています')}await r.set({name:n,order:Math.max(-1,...S.stores.map(x=>x.order||0))+1});useStore(c)}catch(e){busy(0);toast('登録できません。通信を確認して、もう一度試してください')}}
async function wipe(ps){for(let i=0;i<ps.length;i+=400){const b=db.batch();ps.slice(i,i+400).forEach(p=>b.delete(db.doc(p)));await b.commit()}}
function delPeriod(){const ds=S.days.filter(d=>d.date.startsWith(H.key));ask(H.key+'の売上（'+ds.length+'日分）を削除します。元に戻せません。',async()=>{const ids=new Set(ds.map(d=>d.id)),sr=new Set(ds.map(d=>d.src).filter(Boolean));const ps=[...ds.map(d=>'days/'+d.id),...S.orders.filter(o=>sr.has(o.day)).map(o=>'orders/'+o.id),...[...sr].map(x=>'counters/'+x)];S.days=S.days.filter(d=>!ids.has(d.id));DD=DD.filter(d=>!ids.has(d.id));S.orders=S.orders.filter(o=>!sr.has(o.day));H.key=null;if(db)try{await wipe(ps)}catch(e){toast('削除できません')}render()})}
function undoClose(){const d=DD.filter(x=>x._o).sort((a,b)=>b.closedAt-a.closedAt)[0];if(!d)return toast('取り消せる締めがありません');if(cur().length)return toast('締めたあとに新しい注文があるため、取り消せません');ask(d.date+'の締めを取り消して、営業中に戻します。',async()=>{try{for(const o of d._o){const{id,...r}=o;await db.doc('orders/'+id).set(r)}await db.doc('config/state').set({day:d.src});await db.doc('days/'+d.id).delete()}catch(e){return toast('取り消せません')}S.orders.push(...d._o);S.days=S.days.filter(x=>x.id!==d.id);DD=DD.filter(x=>x.id!==d.id);S.state={day:d.src};nav=[];V='home';render()})}
function wipeAll(){ask('注文と売上履歴をすべて削除します（商品登録は残ります）。元に戻せません。',()=>ask('本当に削除しますか？',async()=>{const ids=new Set([...S.orders.map(o=>o.day),...S.days.map(d=>d.src),'d0',dayId()].filter(Boolean));const ps=[...S.orders.map(o=>'orders/'+o.id),...S.days.map(d=>'days/'+d.id),...[...ids].map(x=>'counters/'+x),'config/state'];S.orders=[];S.days=[];S.state={};carts=[{id:1,q:{}}];ct=1;nt=2;if(db)try{await wipe(ps)}catch(e){toast('削除できません')}toast('削除しました');nav=[];V='home';render()}))}
function sum(os){const A={cash:0,other:0,count:os.length,hc:Array(24).fill(0),ho:Array(24).fill(0),items:[]},m={};
  os.forEach(o=>{const c=o.pay==='cash',h=new Date(o.createdAt).getHours();(c?A.hc:A.ho)[h]+=o.total;c?A.cash+=o.total:A.other+=o.total;
    o.items.forEach(i=>{const x=m[i.n]||(m[i.n]={n:i.n,c:0,o:0,qc:0,qo:0});c?(x.c+=i.p*i.q,x.qc+=i.q):(x.o+=i.p*i.q,x.qo+=i.q)})});
  A.items=Object.values(m).sort((a,b)=>b.c+b.o-a.c-a.o);return A}
function doClose(){const os=cur();if(!os.length)return toast('注文がないため締められません');if(!OWNER||!OWNER.pub)return toast('先にオーナーが「管理」でパスワードを設定してください');ask('営業を終了して締めますか？',()=>closeNow(os))}async function closeNow(os){if(!db)return toast('同期が使えないため締められません');const A=sum(os),d=new Date(Math.min(...os.map(o=>o.createdAt))),p=n=>String(n).padStart(2,'0'),id='x'+Date.now(),src=dayId();
  try{if(!STORE.pub)await ensureStoreKey();const sl={cash:A.cash,other:A.other,count:A.count,hc:A.hc,ho:A.ho,items:A.items};
    const doc={src,date:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,closedAt:Date.now(),...await seal({sl,os},STORE.pub,OWNER.pub)};
    await db.doc('days/'+id).set(doc);const st={day:'d'+Date.now()};await db.doc('config/state').set(st);
    S.days.unshift({id,...doc});S.state=st;await wipe([...os.map(o=>'orders/'+o.id),'counters/'+src]);S.orders=S.orders.filter(o=>o.day!==src)}catch(e){return toast('締め処理に失敗しました。もう一度試してください')}
  carts=[{id:1,q:{}}];ct=1;nt=2;nav=[];V='home';toast('営業を終了しました');render()}
function salesView(){const L={y:4,m:7,d:10},K=H.key,pk=(c,o)=>H.f==='c'?c:H.f==='o'?o:c+o;
  const seg=`<div class="seg">${[['y','年別'],['m','月別'],['d','日別']].map(([k,n])=>`<button class="${H.lvl===k?'on':''}" onclick="H.lvl='${k}';H.key=null;render()">${n}</button>`).join('')}</div><div class="seg">${[['a','すべて'],['c','現金'],['o','現金以外']].map(([k,n])=>`<button class="${H.f===k?'on':''}" onclick="H.f='${k}';render()">${n}</button>`).join('')}</div>`;
  if(!K){const g={};DD.forEach(d=>{const k=d.date.slice(0,L[H.lvl]);(g[k]=g[k]||[]).push(d)});
    return '<main>'+(RO||V==='admin'?'':'<button class="sm" onclick="undoClose()">直近の締めを取り消す</button>')+seg+(Object.keys(g).sort().reverse().map(k=>{const A=aggD(g[k]);return `<button class="box" style="width:100%;text-align:left" onclick="H.key='${k}';render()"><div class="r"><b>${k}</b><b>${yen(pk(A.cash,A.other))}</b></div><div class="sub">${A.count}件</div></button>`}).join('')||'<div class="empty">締め処理済みの売上はまだありません</div>')+'</main>'}
  const A=aggD(DD.filter(d=>d.date.startsWith(K))),bs=V==='admin'&&!AS?`<div class="box"><b>店舗別</b>${S.stores.map(x=>{const a=aggD(DD.filter(d=>d.date.startsWith(K)&&d._s===x.id));return `<div class="r"><span>${esc(x.name)}</span><span>${yen(pk(a.cash,a.other))}</span></div>`}).join('')}</div>`:'',hs=A.hc.map((c,i)=>[i,pk(c,A.ho[i])]).filter(x=>x[1]),mx=Math.max(1,...hs.map(x=>x[1]));
  return `<main><button class="sm" onclick="H.key=null;render()">＜ 一覧へ</button> <b>${K}</b>${seg}<div class="box"><div class="big">${yen(pk(A.cash,A.other))}</div><div class="r"><span>注文数</span><b>${A.count}件</b></div><div class="r"><span>現金</span><b>${yen(A.cash)}</b></div><div class="r"><span>現金以外</span><b>${yen(A.other)}</b></div></div>${bs}
  <div class="box"><b>時間帯別</b>${hs.map(([h,v])=>`<div class="r"><span style="width:44px">${h}時</span><div style="flex:1"><div class="bar-i" style="width:${v/mx*100}%"></div></div><span>${yen(v)}</span></div>`).join('')||'<div class="sub">データなし</div>'}</div>
  <div class="box"><b>商品別</b>${A.items.map(i=>[i.n,pk(i.c,i.o),H.f==='c'?i.qc:H.f==='o'?i.qo:i.qc+i.qo]).filter(x=>x[2]).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="r"><span>${esc(x[0])} ×${x[2]}</span><span>${yen(x[1])}</span></div>`).join('')||'<div class="sub">データなし</div>'}</div>${H.lvl==='d'&&!RO&&V!=='admin'?'<button class="pb rd" onclick="delPeriod()">この日の売上を削除</button>':''}</main>`}
function aggD(ds){const A={cash:0,other:0,count:0,hc:Array(24).fill(0),ho:Array(24).fill(0)},m={};
  ds.forEach(d=>{A.cash+=d.cash;A.other+=d.other;A.count+=d.count;d.hc.forEach((v,i)=>{A.hc[i]+=v;A.ho[i]+=d.ho[i]});d.items.forEach(x=>{const y=m[x.n]||(m[x.n]={n:x.n,c:0,o:0,qc:0,qo:0});['c','o','qc','qo'].forEach(k=>y[k]+=x[k])})});A.items=Object.values(m);return A}
