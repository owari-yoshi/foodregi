function attCalc(r){if(!r||!r.start||!r.end||r.end<=r.start)return null;const st=aset(),wage=Number(r.wage)||wageOf(r.mid),tot=Math.round((r.end-r.start)/60000);let night=0;for(let t=r.start;t<r.end;t+=60000){const h=new Date(t).getHours();if(h>=22||h<5)night++}

/* ==== JAN/EAN バーコード読み取り（自前） ==== */
const BC_W=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const BC_G=BC_W.map(a=>a.slice().reverse());
const BC_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function bcDigit(r,k,set){let T=r[k]+r[k+1]+r[k+2]+r[k+3];if(T<=0)return null;let best=null,be=9,se=9;const tabs=set==='R'?[['R',BC_W]]:[['L',BC_W],['G',BC_G]];
  for(const[t,tb]of tabs)for(let d=0;d<10;d++){const p=tb[d];let e=0;for(let j=0;j<4;j++){const x=r[k+j]*7/T-p[j];e+=x*x}if(e<be){se=be;be=e;best=[d,t]}else if(e<se)se=e}
  return be<0.9&&se-be>0.15?best:null}
function bcWin(s,w,isMin){const n=s.length,o=new Float32Array(n),q=new Int32Array(n);let h=0,t=0;for(let i=0;i<n+w;i++){if(i<n){while(t>h&&(isMin?s[q[t-1]]>=s[i]:s[q[t-1]]<=s[i]))t--;q[t++]=i}const c=i-w;if(c>=0){while(q[h]<c-w)h++;o[c]=s[q[h]]}}return o}
function bcRuns(L){const n=L.length;if(n<60)return null;const s=new Float32Array(n);for(let i=0;i<n;i++)s[i]=(L[Math.max(0,i-1)]+2*L[i]+L[Math.min(n-1,i+1)])/4;
  let mn=255,mx=0;for(let i=0;i<n;i++){if(s[i]<mn)mn=s[i];if(s[i]>mx)mx=s[i]}if(mx-mn<35)return null;
  const w=Math.max(5,Math.round(n/18)),lo=bcWin(s,w,true),hi=bcWin(s,w,false),dl=(mx-mn)*0.05;
  const runs=[],cols=[];let cur=-1,len=0;for(let i=0;i<n;i++){const m=(lo[i]+hi[i])/2,ok=hi[i]-lo[i]>(mx-mn)*0.25;let c;if(ok&&s[i]<m-dl)c=1;else if(!ok||s[i]>m+dl)c=ok?0:(s[i]<(mx+mn)/2?1:0);else c=cur<0?0:cur;
    if(c===cur)len++;else{if(cur>=0){runs.push(len);cols.push(cur)}cur=c;len=1}}runs.push(len);cols.push(cur);return{runs,cols}}
function bcCheck(d){const n=d.length;let s=0;for(let i=0;i<n-1;i++)s+=d[i]*((n-1-i)%2?3:1);return(10-s%10)%10===d[n-1]}
function bcTry(r0,c,i){const out=[];
  for(const[N,M,H] of [[59,95,6],[43,67,4]]){if(i+N>r0.length)continue;const mg0=3+H*4,eg0=mg0+5+H*4,G=[0,1,2,mg0,mg0+1,mg0+2,mg0+3,mg0+4,eg0,eg0+1,eg0+2];let sb=0,nb=0,ss=0,ns=0;for(const j of G){if(j%2===0){sb+=r0[i+j];nb++}else{ss+=r0[i+j];ns++}}
    const sp=(sb/nb-ss/ns)/2,r=new Float32Array(N);let S=0;for(let j=0;j<N;j++){r[j]=r0[i+j]+(j%2===0?-sp:sp);S+=r0[i+j]}const m=S/M;if(m<1.1)continue;const ok=x=>x>m*0.5&&x<m*1.7;
    if(!G.every(j=>ok(r[j])))continue;if(i>0&&r0[i-1]<m*3)continue;if(i+N<r0.length&&r0[i+N]<m*3)continue;
    const L=[],par=[];let bad=false;for(let k=0;k<H;k++){const x=bcDigit(r,3+k*4,'LG');if(!x){bad=true;break}L.push(x[0]);par.push(x[1])}if(bad)continue;
    const R=[];for(let k=0;k<H;k++){const x=bcDigit(r,mg0+5+k*4,'R');if(!x){bad=true;break}R.push(x[0])}if(bad)continue;
    let ds;if(H===6){const f=BC_P.indexOf(par.join(''));if(f<0)continue;ds=[f,...L,...R]}else{if(par.some(p=>p!=='L'))continue;ds=[...L,...R]}
    if(bcCheck(ds))out.push(ds.join(''))}return out}
function bcLine(L){const x=bcRuns(L);if(!x)return null;const{runs,cols}=x;for(let pass=0;pass<2;pass++){const r=pass?runs.slice().reverse():runs,c=pass?cols.slice().reverse():cols;for(let i=0;i<r.length;i++){if(c[i]!==1)continue;const o=bcTry(r,c,i);if(o.length)return o[0]}}return null}
function bcSample(g,W,H,x0,y0,x1,y1){const n=Math.floor(Math.hypot(x1-x0,y1-y0));if(n<60)return null;const L=new Uint8Array(n),dx=(x1-x0)/n,dy=(y1-y0)/n;let x=x0,y=y0;for(let i=0;i<n;i++){const xi=x|0,yi=y|0;L[i]=xi>=0&&yi>=0&&xi<W&&yi<H?g[yi*W+xi]:255;x+=dx;y+=dy}return L}
function bcGray(ctx,W,H){const d=ctx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return g}
/* 画像全体をいろいろな線で調べる。found: {code:回数} */
function bcScan(g,W,H,dense){const found={},cx=W/2,cy=H/2,angs=dense?[0,-6,6,-12,12,-20,20,-30,30]:[0,-7,7,-15,15],ys=dense?24:9,span=dense?0.9:0.6;
  for(const vert of[false,true]){const w=vert?H:W,h=vert?W:H;for(const a of angs){const t=a*Math.PI/180,ca=Math.cos(t),sa=Math.sin(t),half=Math.hypot(w,h)/2;
    for(let k=0;k<ys;k++){const off=(k/(ys-1)-0.5)*h*span;let px=-sa*off,py=ca*off,x0=px-ca*half,y0=py-sa*half,x1=px+ca*half,y1=py+sa*half;
      let X0,Y0,X1,Y1;if(vert){X0=cx+y0;Y0=cy+x0;X1=cx+y1;Y1=cy+x1}else{X0=cx+x0;Y0=cy+y0;X1=cx+x1;Y1=cy+y1}
      const L=bcSample(g,W,H,X0,Y0,X1,Y1);if(!L)continue;const c=bcLine(L);if(c)found[c]=(found[c]||0)+1}}}
  return found}

function scanCode(cb){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px;overflow:auto';

  document.body.appendChild(d);const v=d.querySelector('video'),st=d.querySelector('#bcs'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let done=false,stream=null,tm=null,seen={};
  const msg=t=>{st.textContent=t};
  const fin=c=>{if(done)return;done=true;clearTimeout(tm);if(stream)stream.getTracks().forEach(t=>t.stop());d.remove();if(c){try{navigator.vibrate(80)}catch(e){}cb(c)}};
  d.querySelector('#qrc').onclick=()=>fin(null);d.querySelector('#qro').onclick=()=>{const x=d.querySelector('#qrt').value.normalize('NFKC').replace(/\D/g,'');if(x)fin(x);else msg('番号を入力してください')};
  const grab=(src,sw,sh,max)=>{const k=Math.min(1,max/Math.max(sw,sh)),W=Math.round(sw*k),H=Math.round(sh*k);cv.width=W;cv.height=H;cx.drawImage(src,0,0,W,H);return[bcGray(cx,W,H),W,H]};

  const cam=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});if(done){stream.getTracks().forEach(t=>t.stop());return}v.srcObject=stream;try{await v.play()}catch(e){}
    try{const tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}msg('読み取り中…');loop()}
    catch(e){msg('カメラを使えませんでした。カメラの使用を許可するか、下の「写真を撮って読み取る」を使ってください。LINEなどのアプリ内で開いている場合は、SafariかChromeで開き直してください。')}};
