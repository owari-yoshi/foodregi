 return `<main><div class="tabs" style="margin:-12px -12px 12px">${p.map(x=>`<button class="tb ${x.id===pgP?'on':''}" onclick="pgP='${x.id}';render()">${esc(x.n)}</button>`).join('')}</div>
 <div class="ln"><input id="np" placeholder="新しいページ名（例：ドリンク）"><button onclick="addPage()">ページ追加</button></div>
 <div class="box"><div class="sub">このページの名前</div><div class="ln" style="margin-top:6px"><input value="${esc(p.find(x=>x.id===pgP).n)}" onchange="renPage(this.value)"><button onclick="delPage()">ページ削除</button></div></div>
 ${S.menu.map((m,k)=>pg(m)===pgP?`<div class="ln"><input value="${esc(m.n)}" onchange="S.menu[${k}].n=this.value;saveMenu()"><input type="number" value="${m.p}" onchange="S.menu[${k}].p=+this.value;saveMenu()"><button onclick="delItem(${k})">×</button></div>`:'').join('')}
 <button class="pb al" onclick="addItem()">＋ このページに商品を追加</button><p class="sub">並び替えはレジ画面で商品を長押ししてドラッグします。</p></main>`}

function bindReg(){const g=$('#grid');g.onclick=e=>{if(dragging)return;const t=e.target.closest('.item');if(!t)return;const q=cart().q,id=t.dataset.id,m=S.menu.find(x=>x.id===id);if(e.target.closest('.mn')){const k=Object.keys(q).filter(k=>k.split('#')[0]===id).pop();if(k){q[k]--;if(q[k]<=0)delete q[k]}}else if(m.sz&&m.sz.length)pickSize(m);else q[id]=(q[id]||0)+1;drawGrid();drawBar()};mkDrag(g,'.item',0,o=>{const cp=curPg(),od=o.map(id=>S.menu.find(m=>m.id===id)).filter(Boolean);S.menu=[...S.menu.filter(m=>!(pg(m)===cp&&!m.hide)),...od];saveMenu()});mkDrag($('#ptabs'),'.tb',0,reorderPages)}
function pickSize(m){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px';d.innerHTML='<div class="box" style="max-width:320px;width:100%;margin:0"><b></b></div>';const bx=d.firstChild;bx.firstChild.textContent=m.n+'のサイズを選択';m.sz.forEach((s,k)=>{const b=document.createElement('button');b.className='pb al';b.textContent=s.n+'　'+yen(s.p);b.onclick=()=>{const q=cart().q,key=m.id+'#'+k;q[key]=(q[key]||0)+1;d.remove();drawGrid();drawBar()};bx.appendChild(b)});const c=document.createElement('button');c.className='sm';c.style.cssText='width:100%;margin-top:10px';c.textContent='キャンセル';c.onclick=()=>d.remove();bx.appendChild(c);document.body.appendChild(d)}
function drawGrid(){const q=cart().q,cp=curPg(),l=S.menu.filter(m=>pg(m)===cp&&!m.hide);$('#grid').innerHTML=l.map(m=>{const n=iq(q,m.id),s=m.sz&&m.sz.length,bd=s?Object.entries(q).filter(([k])=>k.split('#')[0]===m.id).map(([k,v])=>{const z=m.sz[k.split('#')[1]];return z?z.n+'×'+v:''}).join(' '):'';return `<div class="item" data-id="${m.id}">${n?`<button class="mn">−</button><div class="q">${n}</div>`:''}<b>${s?yen(Math.min(...m.sz.map(z=>z.p)))+'〜':yen(m.p)}</b><span>${esc(m.n)}</span>${bd?`<small class="sub">${esc(bd)}</small>`:''}</div>`}).join('')||'<div class="empty" style="grid-column:1/4">「商品登録」から商品を追加してください</div>'}
function drawPtabs(){const p=vpages(),e=$('#ptabs');if(!e)return;const q=cart().q,cp=curPg();e.style.display=p.length<2?'none':'';e.innerHTML=p.map(x=>{const n=S.menu.filter(m=>pg(m)===x.id&&!m.hide).reduce((a,m)=>a+iq(q,m.id),0);return `<button class="tb ${x.id===cp?'on':''}" data-id="${x.id}" onclick="pgR='${x.id}';drawGrid();drawPtabs()">${esc(x.n)}${n?' ('+n+')':''}</button>`}).join('')}
const szPanel=(m,k)=>`<div class="sub">サイズ（例：M / L / メガ）を設定すると、注文時にサイズを選びます。サイズがある商品は各サイズの値段が使われます。</div>${(m.sz||[]).map((z,j)=>`<div class="ln" style="margin-top:6px"><input style="flex:1" value="${esc(z.n)}" onchange="S.menu[${k}].sz[${j}].n=this.value;saveMenu()"><input type="number" style="width:90px" value="${z.p}" onchange="S.menu[${k}].sz[${j}].p=+this.value;saveMenu()"><button onclick="S.menu[${k}].sz.splice(${j},1);saveMenu();render()">×</button></div>`).join('')}<button class="sm" style="margin-top:8px" onclick="(S.menu[${k}].sz=S.menu[${k}].sz||[]).push({n:'M',p:${m.p||0}});saveMenu();render()">＋ サイズを追加</button>`;
function prodView(){const p=pages();if(!p.some(x=>x.id===pgP))pgP=p[0].id;const cu=p.find(x=>x.id===pgP);return `<main><div class="tabs" id="ppt" style="margin:-12px -12px 12px">${p.map(x=>`<button class="tb ${x.id===pgP?'on':''}" data-id="${x.id}" onclick="pgP='${x.id}';render()">${x.hide?'🚫 ':''}${esc(x.n)}</button>`).join('')}</div><div class="ln"><input id="np" style="flex:1" placeholder="新しいページ名（例：ドリンク）"><button onclick="addPage()">ページ追加</button></div><div class="box"><div class="ln"><input style="flex:1" value="${esc(cu.n)}" onchange="renPage(this.value)"><button onclick="delPage()">ページ削除</button></div><label class="r"><span>注文画面にこのページのタブを表示</span><input type="checkbox" ${cu.hide?'':'checked'} onchange="togPage(this.checked)"></label><div class="sub">ページのタブは長押しで並び替え</div></div><div id="pil">${S.menu.map((m,k)=>pg(m)===pgP?`<div class="box pi" data-id="${m.id}" style="${m.hide?'opacity:.55':''}"><div class="ln"><span class="hd" style="font-size:22px;padding:6px 4px;touch-action:none">☰</span><input style="flex:1" value="${esc(m.n)}" onchange="S.menu[${k}].n=this.value;saveMenu()">${m.sz&&m.sz.length?'<span class="sub">サイズ別</span>':`<input type="number" style="width:90px" value="${m.p}" onchange="S.menu[${k}].p=+this.value;saveMenu()">`}</div><div class="ln"><button style="flex:1" onclick="togItem(${k})">${m.hide?'表示する':'非表示にする'}</button><button style="flex:1" onclick="PX=PX==='${m.id}'?null:'${m.id}';render()">サイズ設定</button><button onclick="delItem(${k})">削除</button></div>${PX===m.id?szPanel(m,k):''}</div>`:'').join('')}</div><button class="pb al" onclick="addItem()">＋ このページに商品を追加</button><p class="sub">☰を長押ししてドラッグすると商品を並び替えできます。非表示にした商品は注文画面に出ません。</p></main>`}
function bindProd(){mkDrag($('#pil'),'.pi','.hd',o=>{S.menu=[...S.menu.filter(m=>pg(m)!==pgP),...o.map(id=>S.menu.find(m=>m.id===id)).filter(Boolean)];saveMenu()});mkDrag($('#ppt'),'.tb',0,reorderPages)}
function togItem(k){S.menu[k].hide=!S.menu[k].hide;saveMenu();render()}
function togPage(v){pages().find(x=>x.id===pgP).hide=!v;saveMenu();render()}
function drawGridOld(){const q=cart().q,cp=curPg();$('#grid').innerHTML=S.menu.filter(m=>pg(m)===cp).map(m=>`<div class="item" data-id="${m.id}">${q[m.id]?`<button class="mn">−</button><div class="q">${q[m.id]}</div>`:''}<b>${yen(m.p)}</b><span>${esc(m.n)}</span></div>`).join('')||'<div class="empty" style="grid-column:1/4">「商品登録」から商品を追加してください</div>'}
function drawBar(){const c=cart();$('#nx').innerHTML=`<span>${cnt(c)}点</span><span>${yen(tot(c))}</span><span>▶</span>`;$('#nx').disabled=!cnt(c);drawTabs()}
function bindGrid(g){let dg=null,lp,sx,sy;
  g.onclick=e=>{if(dragging)return;const t=e.target.closest('.item');if(!t)return;const q=cart().q,id=t.dataset.id;if(e.target.closest('.mn')){q[id]=(q[id]||1)-1;if(q[id]<=0)delete q[id]}else q[id]=(q[id]||0)+1;drawGrid();drawBar()};
  g.addEventListener('touchstart',e=>{const t=e.target.closest('.item');if(!t||e.target.closest('.mn'))return;const p=e.touches[0];sx=p.clientX;sy=p.clientY;lp=setTimeout(()=>{dg=t;dragging=true;t.classList.add('drag');try{navigator.vibrate(40)}catch(_){}},450)});
  g.addEventListener('touchmove',e=>{const p=e.touches[0];if(!dg){if(Math.abs(p.clientX-sx)+Math.abs(p.clientY-sy)>10)clearTimeout(lp);return}e.preventDefault();const el=document.elementFromPoint(p.clientX,p.clientY),t=el&&el.closest('.item');if(t&&t!==dg){const k=[...g.children];g.insertBefore(dg,k.indexOf(dg)<k.indexOf(t)?t.nextSibling:t)}},{passive:false});
  const end=()=>{clearTimeout(lp);if(dg){dg.classList.remove('drag');const cp=curPg(),od=[...g.children].map(c=>S.menu.find(m=>m.id===c.dataset.id)).filter(Boolean);S.menu=[...S.menu.filter(m=>pg(m)!==cp),...od];saveMenu();dg=null;setTimeout(()=>{dragging=false},150)}};
  g.addEventListener('touchend',end);g.addEventListener('touchcancel',end)}
function key(k){const T=tot(cart());
  if(k==='完了'){if(Number(P.cash)<T)return toast('お預かりが不足しています');return finish('cash')}
  if(k==='現金以外で完了')return finish('other');
  P.cash=k==='⌫'?P.cash.slice(0,-1):k==='削除'?'':(P.cash+k).replace(/^0+/,'').slice(0,8);drawPay()}
function drawPay(){const T=tot(cart()),c=Number(P.cash);$('#cv').textContent=P.cash?Number(P.cash).toLocaleString():'0';$('#cg').textContent='おつり '+(c>=T?yen(c-T):'—')}
async function finish(k){const c=cart(),T=tot(c),items=lines(c);if(!items.length||finish.b)return;finish.b=1;setTimeout(()=>{finish.b=0},1500);
  const now=Date.now();let num=cur().reduce((a,o)=>Math.max(a,o.num||0),0)+1;if(db)try{num=await db.runTransaction(async t=>{const r=db.doc('counters/'+dayId()),x=await t.get(r),n=(x.exists?x.data().n:0)+1;t.set(r,{n});return n})}catch(e){}
  put('orders',{id:'o'+now,num,items,total:T,status:'new',createdAt:now,day:dayId(),pay:k,cash:k==='cash'?Number(P.cash):null});
  if(carts.length>1)carts=carts.filter(x=>x!==c),ct=carts[0].id;else c.q={};
  toast('注文#'+num+'を厨房へ送信しました');back()}
function setSt(id,s){const o=S.orders.find(x=>x.id===id);if(o){put('orders',{...o,status:s});render()}}
function edit(id){E=JSON.parse(JSON.stringify(S.orders.find(o=>o.id===id)));go('edit')}
function addL(){const m=S.menu[$('#ad').value];if(m){E.items.push({n:m.n,p:m.p,q:1});render()}}
function saveEdit(){E.items=E.items.filter(i=>i.q>0);if(!E.items.length)return toast('商品がありません。取り消す場合は「取り消す」を押してください');
  E.total=E.items.reduce((s,i)=>s+i.p*i.q,0);E.status='new';E.edited=true;put('orders',E);toast('修正を厨房に反映しました');back()}
function delOrder(){ask('この注文を取り消しますか？',()=>{S.orders=S.orders.filter(o=>o.id!==E.id);if(db)w(db.doc('orders/'+E.id).delete());back()})}
function sum(os){const A={cash:0,other:0,count:os.length,hc:Array(24).fill(0),ho:Array(24).fill(0),items:[]},m={};
  os.forEach(o=>{const c=o.pay==='cash',h=new Date(o.createdAt).getHours();(c?A.hc:A.ho)[h]+=o.total;c?A.cash+=o.total:A.other+=o.total;
    o.items.forEach(i=>{const x=m[i.n]||(m[i.n]={n:i.n,c:0,o:0,qc:0,qo:0});c?(x.c+=i.p*i.q,x.qc+=i.q):(x.o+=i.p*i.q,x.qo+=i.q)})});
  A.items=Object.values(m).sort((a,b)=>b.c+b.o-a.c-a.o);return A}
function doClose(){const os=cur();if(!os.length)return toast('注文がないため締められません');ask('営業を終了して締めますか？',()=>closeNow(os))}function closeNow(os){
  const A=sum(os),d=new Date(Math.min(...os.map(o=>o.createdAt))),p=n=>String(n).padStart(2,'0');
  put('days',{id:'x'+Date.now(),date:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,cash:A.cash,other:A.other,count:A.count,hc:A.hc,ho:A.ho,items:A.items,closedAt:Date.now()});
  S.state={day:'d'+Date.now()};if(db)w(db.doc('config/state').set(S.state));
  carts=[{id:1,q:{}}];ct=1;nt=2;nav=[];V='home';toast('営業を終了しました');render()}
function salesView(){const L={y:4,m:7,d:10},K=H.key,pk=(c,o)=>H.f==='c'?c:H.f==='o'?o:c+o;
  const seg=`<div class="seg">${[['y','年別'],['m','月別'],['d','日別']].map(([k,n])=>`<button class="${H.lvl===k?'on':''}" onclick="H.lvl='${k}';H.key=null;render()">${n}</button>`).join('')}</div><div class="seg">${[['a','すべて'],['c','現金'],['o','現金以外']].map(([k,n])=>`<button class="${H.f===k?'on':''}" onclick="H.f='${k}';render()">${n}</button>`).join('')}</div>`;
  if(!K){const g={};S.days.forEach(d=>{const k=d.date.slice(0,L[H.lvl]);(g[k]=g[k]||[]).push(d)});
    return '<main>'+seg+(Object.keys(g).sort().reverse().map(k=>{const A=aggD(g[k]);return `<button class="box" style="width:100%;text-align:left" onclick="H.key='${k}';render()"><div class="r"><b>${k}</b><b>${yen(pk(A.cash,A.other))}</b></div><div class="sub">${A.count}件</div></button>`}).join('')||'<div class="empty">締め処理済みの売上はまだありません</div>')+'</main>'}
  const A=aggD(S.days.filter(d=>d.date.startsWith(K))),hs=A.hc.map((c,i)=>[i,pk(c,A.ho[i])]).filter(x=>x[1]),mx=Math.max(1,...hs.map(x=>x[1]));
  return `<main><button class="sm" onclick="H.key=null;render()">＜ 一覧へ</button> <b>${K}</b>${seg}<div class="box"><div class="big">${yen(pk(A.cash,A.other))}</div><div class="r"><span>注文数</span><b>${A.count}件</b></div><div class="r"><span>現金</span><b>${yen(A.cash)}</b></div><div class="r"><span>現金以外</span><b>${yen(A.other)}</b></div></div>
  <div class="box"><b>時間帯別</b>${hs.map(([h,v])=>`<div class="r"><span style="width:44px">${h}時</span><div style="flex:1"><div class="bar-i" style="width:${v/mx*100}%"></div></div><span>${yen(v)}</span></div>`).join('')||'<div class="sub">データなし</div>'}</div>
  <div class="box"><b>商品別</b>${A.items.map(i=>[i.n,pk(i.c,i.o),H.f==='c'?i.qc:H.f==='o'?i.qo:i.qc+i.qo]).filter(x=>x[2]).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="r"><span>${esc(x[0])} ×${x[2]}</span><span>${yen(x[1])}</span></div>`).join('')||'<div class="sub">データなし</div>'}</div></main>`}
function aggD(ds){const A={cash:0,other:0,count:0,hc:Array(24).fill(0),ho:Array(24).fill(0)},m={};
  ds.forEach(d=>{A.cash+=d.cash;A.other+=d.other;A.count+=d.count;d.hc.forEach((v,i)=>{A.hc[i]+=v;A.ho[i]+=d.ho[i]});d.items.forEach(x=>{const y=m[x.n]||(m[x.n]={n:x.n,c:0,o:0,qc:0,qo:0});['c','o','qc','qo'].forEach(k=>y[k]+=x[k])})});A.items=Object.values(m);return A}

(async()=>{render();
  try{if(!window.firebase||!FIREBASE_CONFIG.projectId)throw 0;firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){db=null}
  if(!db){const e=$('#warn');e.textContent='Firebaseの設定が未入力か読み込めません。この端末内だけで動作しています';e.hidden=false;return}
  const sub=(q,f)=>q.onSnapshot(s=>{f(s);refresh()},e=>{$('#warn').textContent='同期エラー: '+e.code;$('#warn').hidden=false});
  sub(db.collection('orders').orderBy('createdAt','desc').limit(500),s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()}));
    const ids=new Set(S.orders.filter(o=>o.status==='new').map(o=>o.id));if(seen&&V==='kitchen'&&[...ids].some(i=>!seen.has(i))){try{navigator.vibrate(300)}catch(_){}toast('新しい注文')}seen=ids});
  sub(db.collection('days').orderBy('date','desc').limit(1000),s=>{S.days=s.docs.map(d=>({id:d.id,...d.data()}))});
  sub(db.collection('config'),s=>s.docs.forEach(d=>{if(d.id==='menu'){const x=JSON.parse(JSON.stringify(d.data()));S.menu=x.items||[];S.pages=x.pages||[]}if(d.id==='state')S.state=d.data()}));
})();
</script></body></html>
