function mkDrag(g,sel,hd,end){let dg=null,lp,sx,sy,mv=false;g.addEventListener('touchstart',e=>{const t=e.target.closest(sel);if(!t||e.target.closest('.mn,input,select')||(hd&&!e.target.closest(hd)))return;const p=e.touches[0];sx=p.clientX;sy=p.clientY;mv=false;lp=setTimeout(()=>{dg=t;dragging=true;dragAt=Date.now();t.classList.add('drag');try{navigator.vibrate(40)}catch(_){}},hd?100:500)},{passive:true});g.addEventListener('touchmove',e=>{const p=e.touches[0];if(!dg){if(Math.abs(p.clientX-sx)+Math.abs(p.clientY-sy)>10)clearTimeout(lp);return}e.preventDefault();if(Math.abs(p.clientX-sx)+Math.abs(p.clientY-sy)>12)mv=true;const el=document.elementFromPoint(p.clientX,p.clientY),t=el&&el.closest(sel);if(t&&t!==dg&&t.parentNode===g){const k=[...g.children];g.insertBefore(dg,k.indexOf(dg)<k.indexOf(t)?t.nextSibling:t)}},{passive:false});const f=()=>{clearTimeout(lp);if(dg){dg.classList.remove('drag');const o=[...g.children].map(c=>c.dataset.id),m=mv;dg=null;if(m){setTimeout(()=>{dragging=false},150);end(o)}else dragging=false}};g.addEventListener('touchend',f);g.addEventListener('touchcancel',f)}

/* ==== JAN/EAN バーコード読み取り（自前） ==== */
const BC_W=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const BC_G=BC_W.map(a=>a.slice().reverse());
const BC_P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function bcDigit(r,k,set){let T=r[k]+r[k+1]+r[k+2]+r[k+3];if(T<=0)return null;let best=null,be=9,se=9;const tabs=set==='R'?[['R',BC_W]]:[['L',BC_W],['G',BC_G]];
  for(const[t,tb]of tabs)for(let d=0;d<10;d++){const p=tb[d];let e=0;for(let j=0;j<4;j++){const x=r[k+j]*7/T-p[j];e+=x*x}if(e<be){se=be;be=e;best=[d,t]}else if(e<se)se=e}
  return be<0.9&&se-be>0.15?best:null}
function bcWin(s,w,isMin){const n=s.length,o=new Float32Array(n),q=new Int32Array(n);let h=0,t=0;for(let i=0;i<n+w;i++){if(i<n){while(t>h&&(isMin?s[q[t-1]]>=s[i]:s[q[t-1]]<=s[i]))t--;q[t++]=i}const c=i-w;if(c>=0){while(q[h]<c-w)h++;o[c]=s[q[h]]}}return o}
function bcRuns(L){const n=L.length;if(n<60)return null;const s=new Float32Array(n);for(let i=0;i<n;i++)s[i]=(L[Math.max(0,i-1)]+2*L[i]+L[Math.min(n-1,i+1)])/4;
  let mn=255,mx=0;for(let i=0;i<n;i++){if(s[i]<mn)mn=s[i];if(s[i]>mx)mx=s[i]}if(mx-mn<35)return null;
  const w=Math.max(5,Math.round(n/18)),lo=bcWin(s,w,true),hi=bcWin(s,w,false),dl=(mx-mn)*0.05;
  const runs=[],cols=[];let cur=-1,len=0;for(let i=0;i<n;i++){const m=(lo[i]+hi[i])/2,ok=hi[i]-lo[i]>(mx-mn)*0.25;let c;if(ok&&s[i]<m-dl)c=1;else if(!ok||s[i]>m+dl)c=ok?0:(s[i]<(mx+mn)/2?1:0);else c=cur<0?0:cur;
    if(c===cur)len++;else{if(cur>=0){runs.push(len);cols.push(cur)}cur=c;len=1}}runs.push(len);cols.push(cur);return{runs,cols}}
function bcCheck(d){const n=d.length;let s=0;for(let i=0;i<n-1;i++)s+=d[i]*((n-1-i)%2?3:1);return(10-s%10)%10===d[n-1]}
function bcTry(r0,c,i){const out=[];
  for(const[N,M,H] of [[59,95,6],[43,67,4]]){if(i+N>r0.length)continue;const mg0=3+H*4,eg0=mg0+5+H*4,G=[0,1,2,mg0,mg0+1,mg0+2,mg0+3,mg0+4,eg0,eg0+1,eg0+2];let sb=0,nb=0,ss=0,ns=0;for(const j of G){if(j%2===0){sb+=r0[i+j];nb++}else{ss+=r0[i+j];ns++}}
    const sp=(sb/nb-ss/ns)/2,r=new Float32Array(N);let S=0;for(let j=0;j<N;j++){r[j]=r0[i+j]+(j%2===0?-sp:sp);S+=r0[i+j]}const m=S/M;if(m<1.1)continue;const ok=x=>x>m*0.5&&x<m*1.7;
    if(!G.every(j=>ok(r[j])))continue;if(i>0&&r0[i-1]<m*3)continue;if(i+N<r0.length&&r0[i+N]<m*3)continue;
    const L=[],par=[];let bad=false;for(let k=0;k<H;k++){const x=bcDigit(r,3+k*4,'LG');if(!x){bad=true;break}L.push(x[0]);par.push(x[1])}if(bad)continue;
    const R=[];for(let k=0;k<H;k++){const x=bcDigit(r,mg0+5+k*4,'R');if(!x){bad=true;break}R.push(x[0])}if(bad)continue;
    let ds;if(H===6){const f=BC_P.indexOf(par.join(''));if(f<0)continue;ds=[f,...L,...R]}else{if(par.some(p=>p!=='L'))continue;ds=[...L,...R]}
    if(bcCheck(ds))out.push(ds.join(''))}return out}
function bcLine(L){const x=bcRuns(L);if(!x)return null;const{runs,cols}=x;for(let pass=0;pass<2;pass++){const r=pass?runs.slice().reverse():runs,c=pass?cols.slice().reverse():cols;for(let i=0;i<r.length;i++){if(c[i]!==1)continue;const o=bcTry(r,c,i);if(o.length)return o[0]}}return null}
function bcSample(g,W,H,x0,y0,x1,y1){const n=Math.floor(Math.hypot(x1-x0,y1-y0));if(n<60)return null;const L=new Uint8Array(n),dx=(x1-x0)/n,dy=(y1-y0)/n;let x=x0,y=y0;for(let i=0;i<n;i++){const xi=x|0,yi=y|0;L[i]=xi>=0&&yi>=0&&xi<W&&yi<H?g[yi*W+xi]:255;x+=dx;y+=dy}return L}
function bcGray(ctx,W,H){const d=ctx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;return g}
/* 画像全体をいろいろな線で調べる。found: {code:回数} */
function bcScan(g,W,H,dense){const found={},cx=W/2,cy=H/2,angs=dense?[0,-6,6,-12,12,-20,20,-30,30]:[0,-7,7,-15,15],ys=dense?24:9,span=dense?0.9:0.6;
  for(const vert of[false,true]){const w=vert?H:W,h=vert?W:H;for(const a of angs){const t=a*Math.PI/180,ca=Math.cos(t),sa=Math.sin(t),half=Math.hypot(w,h)/2;
    for(let k=0;k<ys;k++){const off=(k/(ys-1)-0.5)*h*span;let px=-sa*off,py=ca*off,x0=px-ca*half,y0=py-sa*half,x1=px+ca*half,y1=py+sa*half;
      let X0,Y0,X1,Y1;if(vert){X0=cx+y0;Y0=cy+x0;X1=cx+y1;Y1=cy+x1}else{X0=cx+x0;Y0=cy+y0;X1=cx+x1;Y1=cy+y1}
      const L=bcSample(g,W,H,X0,Y0,X1,Y1);if(!L)continue;const c=bcLine(L);if(c)found[c]=(found[c]||0)+1}}}
  return found}

function scanCode(cb){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px;overflow:auto';

  document.body.appendChild(d);const v=d.querySelector('video'),st=d.querySelector('#bcs'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let done=false,stream=null,tm=null,seen={};

  const cam=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});if(done){stream.getTracks().forEach(t=>t.stop());return}v.srcObject=stream;try{await v.play()}catch(e){}
    try{const tr=stream.getVideoTracks()[0],cp=tr.getCapabilities?tr.getCapabilities():{};if(cp.focusMode&&cp.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}msg('読み取り中…');loop()}
    catch(e){msg('カメラを使えませんでした。カメラの使用を許可するか、下の「写真を撮って読み取る」を使ってください。LINEなどのアプリ内で開いている場合は、SafariかChromeで開き直してください。')}};

function invQty(id){const i=(S.inv||[]).find(x=>x.id===id);if(!i)return;const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML=`<div class="box" style="max-width:360px;width:100%;margin:0"><b style="font-size:18px">${esc(i.n||'名前なし')}</b><div class="sub">今の数</div><div class="big" id="iqv">${i.qty||0} <small style="font-size:16px">${esc(i.unit||'')}</small></div>
  <input id="iqn" inputmode="decimal" placeholder="数を入力" style="width:100%;margin:8px 0;font-size:20px">
  <div class="ln"><button style="flex:1" data-k="sub">− 減らす</button><button style="flex:1" data-k="add">＋ 増やす</button></div><button class="pb al" data-k="set" style="margin-top:2px">この数に直す</button><button class="sm" data-k="x" style="width:100%;margin-top:8px">閉じる</button></div>`;
  document.body.appendChild(d);const n=d.querySelector('#iqn');setTimeout(()=>n.focus(),50);
  d.onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(e.target===d||k==='x'){d.remove();return}if(!k)return;const v=inum(n.value);if(n.value===''||isNaN(v)||v<0)return toast('数を入力してください');d.remove();if(k==='set'){invSetQ(id,v,'数を直す');render()}else invAdj(id,k==='add'?v:-v)}}
/* 画面 */
function invTabs(){const s=iset(),c=icat();return `<div class="tabs" style="align-items:center">${s.cats.map(x=>`<button class="tb ${x.id===c?'on':''}" onclick="ICAT='${x.id}';render()">${esc(x.n)}${(S.inv||[]).some(i=>(i.cat||s.cats[0].id)===x.id&&ilow(i))?'<i>🔴少ない</i>':''}</button>`).join('')}<button class="tb" onclick="invAddCat()">＋</button><span style="flex:1"></span><button class="tb" style="position:sticky;right:0" onclick="go('invset')">⚙️設定</button></div>`}
function askText(title,ph,cb,bl){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML='<div class="box" style="max-width:340px;width:100%;margin:0"><b></b><input style="width:100%;margin:10px 0"><div class="ln"><button style="flex:1">キャンセル</button><button style="flex:1;background:var(--ac);color:#fff">'+(bl||'追加')+'</button></div></div>';d.querySelector('b').textContent=title;const i=d.querySelector('input');i.placeholder=ph;const bt=d.querySelectorAll('button');bt[0].onclick=()=>d.remove();const ok=()=>{const v=i.value.trim();if(!v)return toast('入力してください');d.remove();cb(v)};bt[1].onclick=ok;i.onkeydown=e=>{if(e.key==='Enter')ok()};document.body.appendChild(d);setTimeout(()=>i.focus(),50)}
function invAddCat(){askText('新しいカテゴリ（タブ）','例：飲料',v=>{const id='c'+Date.now();ICAT=id;saveISet({cats:[...iset().cats,{id,n:v}]});toast('「'+v+'」を追加しました')})}
function invAddItem(){askText('「'+((iset().cats.find(x=>x.id===icat())||{}).n||'')+'」に品目を追加','例：牛肉',v=>{IE=invNew({n:v});ISET='i';if(V==='inv')go('invset');else render();toast('「'+v+'」を追加しました。単位などを設定してください')})}
function invView(){const s=iset(),c=icat(),seg=`<div class="seg sg2">${[['l','在庫'],['t','棚卸し'],['o','発注リスト'+(invLowCount()?`(${invLowCount()})`:'')],['h','履歴']].map(([k,n])=>`<button class="${IM===k?'on':''}" onclick="IM='${k}';IC={};render()">${n}</button>`).join('')}</div>`;
  let b='';
  if(IM==='l'){const l=iitems(c);b=`<div class="ln"><button style="flex:1;padding:12px;font-weight:700" onclick="invAddItem()">＋ 品目を追加</button><button style="flex:1;padding:12px;font-weight:700;background:var(--ac);color:#fff;border-color:var(--ac)" onclick="invScanFind()">📷 バーコードで探す</button></div>`+(l.map(i=>{const lw=ilow(i);return `<div class="box" style="${lw?'border-color:var(--rd);border-width:2px':''}"><div class="r"><button style="flex:1;text-align:left;border:0;background:none;padding:0" onclick="invQty('${i.id}')"><b style="font-size:17px">${esc(i.n||'名前なし')}</b><div class="sub">${[i.loc?'📍'+esc(i.loc):'',iexpB(i),Number(i.min)>0?'発注の目安 '+i.min+esc(i.unit||''):''].filter(Boolean).join('　')}</div></button>
    <button class="sm" style="width:44px;height:44px;font-size:22px" onclick="invAdj('${i.id}',-1)">−</button><button style="min-width:70px;border:0;background:none;text-align:center" onclick="invQty('${i.id}')"><b style="font-size:22px;${lw?'color:var(--rd)':''}">${i.qty||0}</b><div class="sub">${esc(i.unit||'')}</div></button><button class="sm" style="width:44px;height:44px;font-size:22px" onclick="invAdj('${i.id}',1)">＋</button></div>${lw?'<div style="color:var(--rd);font-size:13px;font-weight:700">🔴 少なくなっています</div>':''}</div>`}).join('')||`<div class="empty">品目がありません。<br>「＋ 品目を追加」から登録してください。</div>`)}
  else if(IM==='t'){const l=iitems(c);b=`<p class="sub" style="margin-top:0">今ある数を数えて入力し、最後に「保存」を押してください。空欄の品目は変わりません。</p>`+(l.map(i=>`<div class="box r"><span><b>${esc(i.n||'名前なし')}</b><div class="sub">今の記録：${i.qty||0}${esc(i.unit||'')}</div></span><span style="display:flex;align-items:center;gap:6px"><input inputmode="decimal" style="width:90px;font-size:18px;text-align:right" value="${IC[i.id]??''}" oninput="IC['${i.id}']=this.value"><span>${esc(i.unit||'')}</span></span></div>`).join('')||'<div class="empty">品目がありません</div>')+(l.length?`<button class="pb" onclick="invTana()">棚卸しを保存</button>`:'')}
  else if(IM==='o'){const l=(S.inv||[]).filter(ilow);b=(l.length?`<button class="pb al" style="margin:0 0 10px" onclick="invCopy()">📋 発注リストをコピー（LINEなどに貼れます）</button>`+s.cats.map(ct=>{const g=l.filter(i=>(i.cat||s.cats[0].id)===ct.id);return g.length?`<div class="box"><b>${esc(ct.n)}</b>${g.map(i=>`<div class="r"><span>${esc(i.n)}</span><span style="color:var(--rd)">残り ${i.qty||0}${esc(i.unit||'')}<small class="sub">（目安 ${i.min}${esc(i.unit||'')}）</small></span></div>`).join('')}</div>`:''}).join(''):'<div class="empty">少なくなっている品目はありません。<br>「⚙️設定」で品目ごとに「発注の目安」を決めると、ここに出ます。</div>')+`<p class="sub">すべてのカテゴリの品目が出ます。</p>`}
  else{const l=(S.invlog||[]).slice(0,200);b=(l.map(x=>{const d=Math.round((x.to-x.from)*1000)/1000;return `<div class="box"><div class="r"><b>${esc(x.n||'')}</b><span class="sub">${new Date(x.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div><div class="r"><span class="sub">👤 ${esc(x.by||'不明')}　${esc(x.kind||'')}</span><span>${x.from} → <b>${x.to}</b>${esc(x.unit||'')}（${d>0?'+':''}${d}）</span></div></div>`}).join('')||'<div class="empty">まだ記録がありません</div>')+'<p class="sub">すべてのカテゴリの直近の記録が出ます。</p>'}
  return invTabs()+'<main>'+seg+b+'</main>'}
function invTana(){const ch=Object.entries(IC).filter(([,v])=>String(v).trim()!=='');if(!ch.length)return toast('数が入力されていません');for(const[,v]of ch){const n=inum(v);if(isNaN(n)||n<0)return toast('数の入力を確認してください')}ch.forEach(([id,v])=>invSetQ(id,inum(v),'棚卸し'));IC={};toast(ch.length+'品目を保存しました');render()}
function invCopy(){const s=iset(),l=(S.inv||[]).filter(ilow),d=new Date(),t=`【発注リスト】${STORE.name||''} ${d.getMonth()+1}/${d.getDate()}\n`+s.cats.map(ct=>{const g=l.filter(i=>(i.cat||s.cats[0].id)===ct.id);return g.length?`■${ct.n}\n`+g.map(i=>`・${i.n} 残り${i.qty||0}${i.unit||''}（目安${i.min}${i.unit||''}）`).join('\n'):''}).filter(Boolean).join('\n');
  const ok=()=>toast('コピーしました');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(()=>fbCopy(t));else fbCopy(t)}
function fbCopy(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('コピーしました')}catch(e){toast('コピーできませんでした')}a.remove()}
function invSetView(){const s=iset(),c=icat(),seg=`<div class="seg sg2">${[['i','品目'],['c','カテゴリ'],['u','単位'],['p','保管場所']].map(([k,n])=>`<button class="${ISET===k?'on':''}" onclick="ISET='${k}';render()">${n}</button>`).join('')}</div>`,opt=(l,v)=>l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');let b='';
  if(ISET==='i'){const l=iitems(c);b=`<div class="ln"><button style="flex:1" onclick="invAddItem()">＋ 手入力で追加</button><button style="flex:1" onclick="invScanNew()">📷 バーコードで追加</button></div>`+(l.map((i,k)=>{const o=IE===i.id;return `<div class="box" style="${o?'border:2px solid var(--ac)':''}"><div class="r"><b style="flex:1" onclick="IE=IE==='${i.id}'?null:'${i.id}';render()">${esc(i.n||'（名前を入力）')} <span class="sub">${esc(i.unit||'')}${i.code?' 🏷️':''}</span></b><button class="sm" onclick="invMove('${i.id}',-1)" ${k?'':'disabled'}>↑</button><button class="sm" onclick="invMove('${i.id}',1)" ${k<l.length-1?'':'disabled'}>↓</button><button class="sm" onclick="IE=IE==='${i.id}'?null:'${i.id}';render()">${o?'閉じる':'編集'}</button></div>${o?`
    <div class="sub" style="margin-top:6px">品目名</div><input style="width:100%" value="${esc(i.n||'')}" placeholder="例：牛肉" onchange="invUpd('${i.id}',{n:this.value.trim()})">
    <div class="ln" style="margin-top:8px"><label style="flex:1"><div class="sub">単位</div><select style="width:100%" onchange="invUpd('${i.id}',{unit:this.value})">${s.units.includes(i.unit)||!i.unit?'':`<option selected>${esc(i.unit)}</option>`}${opt(s.units,i.unit)}</select></label><label style="flex:1"><div class="sub">カテゴリ</div><select style="width:100%" onchange="invUpd('${i.id}',{cat:this.value});render()">${s.cats.map(x=>`<option value="${x.id}" ${x.id===(i.cat||s.cats[0].id)?'selected':''}>${esc(x.n)}</option>`).join('')}</select></label></div>
    <div class="ln"><label style="flex:1"><div class="sub">発注の目安（以下で🔴）</div><input inputmode="decimal" style="width:100%" value="${i.min||''}" placeholder="0＝お知らせなし" onchange="const v=inum(this.value||0);if(isNaN(v)||v<0)return toast('数を確認してください');invUpd('${i.id}',{min:v})"></label><label style="flex:1"><div class="sub">保管場所</div><select style="width:100%" onchange="invUpd('${i.id}',{loc:this.value})"><option value="">なし</option>${opt(s.locs,i.loc)}</select></label></div>
    <div class="ln"><label style="flex:1"><div class="sub">賞味期限</div><input type="date" style="width:100%" value="${esc(i.exp||'')}" onchange="invUpd('${i.id}',{exp:this.value})"></label></div>
    <div class="sub">バーコード</div><div class="ln"><input style="flex:1" inputmode="numeric" value="${esc(i.code||'')}" placeholder="なし" onchange="const v=this.value.normalize('NFKC').trim(),o=(S.inv||[]).find(x=>v&&x.code===v&&x.id!=='${i.id}');if(o){toast('「'+o.n+'」に登録済みのバーコードです');render();return}invUpd('${i.id}',{code:v})"><button onclick="invScanSet('${i.id}')">📷 読み取る</button></div>
    <button class="sm" style="color:var(--rd);margin-top:4px" onclick="invDel('${i.id}')">この品目を削除</button>`:''}</div>`}).join('')||'<div class="empty">このカテゴリの品目はまだありません</div>')+'<p class="sub">品目名をタップすると、単位・発注の目安・保管場所・賞味期限・バーコードを設定できます。在庫の数は、在庫画面で入力します。</p>'}
  else if(ISET==='c'){b=s.cats.map((x,k)=>`<div class="ln"><input style="flex:1" value="${esc(x.n)}" onchange="const v=this.value.trim();if(!v)return toast('名前を入力してください');saveISet({cats:iset().cats.map(y=>y.id==='${x.id}'?{...y,n:v}:y)})"><button onclick="invCatMove(${k},-1)" ${k?'':'disabled'}>↑</button><button onclick="invCatMove(${k},1)" ${k<s.cats.length-1?'':'disabled'}>↓</button><button onclick="invCatDel('${x.id}')">削除</button></div>`).join('')+`<div class="ln" style="margin-top:12px"><input id="icn" style="flex:1" placeholder="新しいカテゴリ名"><button onclick="const v=$('#icn').value.trim();if(!v)return toast('名前を入力してください');saveISet({cats:[...iset().cats,{id:'c'+Date.now(),n:v}]})">追加</button></div><p class="sub">カテゴリは在庫画面のタブになります。</p>`}
  else{const key=ISET==='u'?'units':'locs',l=s[key];b=`<div class="box">${l.map((x,k)=>`<div class="r"><span>${esc(x)}</span><button class="sm" onclick="saveISet({${key}:iset().${key}.filter((_,j)=>j!==${k})})">削除</button></div>`).join('')||'<div class="sub">まだありません</div>'}</div><div class="ln"><input id="iun" style="flex:1" placeholder="${ISET==='u'?'例：ケース':'例：クーラーボックス'}"><button onclick="const v=$('#iun').value.trim();if(!v)return toast('入力してください');if(iset().${key}.includes(v))return toast('すでにあります');saveISet({${key}:[...iset().${key},v]})">追加</button></div>`}
  return invTabs().replace(/<button class="tb" style="position:sticky[^]*?<\/button><\/div>$/,'</div>')+'<main>'+seg+b+'</main>'}
function invCatMove(k,d){const c=[...iset().cats],j=k+d;if(j<0||j>=c.length)return;[c[k],c[j]]=[c[j],c[k]];saveISet({cats:c})}
function invCatDel(id){const s=iset();if(s.cats.length<=1)return toast('カテゴリは1つ以上必要です');if((S.inv||[]).some(i=>(i.cat||s.cats[0].id)===id))return toast('このカテゴリの品目を、先に別のカテゴリへ移すか削除してください');ask('このカテゴリを削除しますか？',()=>saveISet({cats:s.cats.filter(x=>x.id!==id)}))}
document.addEventListener('touchstart',()=>{pressing=true;if(dragging&&Date.now()-dragAt>2500)dragging=false},{capture:true,passive:true});
const relP=()=>setTimeout(()=>{pressing=false;if(rpend&&!typing()){rpend=false;refresh()}},120);
document.addEventListener('touchend',relP,true);document.addEventListener('touchcancel',relP,true);
document.addEventListener('mousedown',()=>{pressing=true},true);document.addEventListener('mouseup',relP,true);
document.addEventListener('focusout',()=>setTimeout(()=>{if(rpend&&!pressing&&!typing()){rpend=false;refresh()}},200));
function busy(on){const b=document.querySelector('.pb');if(!b)return;b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='確認中…'}else if(b.dataset.t)b.textContent=b.dataset.t}
(async()=>{LEG=!!ss('store');if(/ Line\//.test(navigator.userAgent||'')&&!/openExternalBrowser=1/.test(location.search)){location.replace(location.href+(location.search?'&':'?')+'openExternalBrowser=1');return}
  {const q=new URLSearchParams(location.search),qs=q.get('s'),qi=q.get('i'),qm=q.get('m'),qk=q.get('k');if(qs&&qi)JOIN=[qs,qi];else if(qs&&qm&&qk)PLINK=[qs,qm,qk];if(qs){try{history.replaceState(null,'',location.pathname)}catch(e){}}}
  V=JOIN||PLINK||SID?'checking':'setup';render();
  try{if(!window.firebase||!FIREBASE_CONFIG.projectId)throw 0;firebase.initializeApp(FIREBASE_CONFIG);raw=firebase.firestore();db=raw}catch(e){db=null}
  if(!db){const e=$('#warn');e.textContent='Firebaseの設定が未入力か読み込めません。この端末内だけで動作しています';e.hidden=false;V=SID?'home':'setup';render();return}
  raw.doc('owner/pw').get().then(o=>{OWNER=o.exists?o.data():null;OL=true}).catch(()=>{});
  raw.collection('stores').orderBy('order').onSnapshot(s=>{S.stores=s.docs.map(d=>({id:d.id,...d.data()}));hqWatch();S.noStores=!s.docs.length;const x=S.stores.find(y=>y.id===SID);if(x){STORE=x;const rf=raw.doc('stores/'+SID);if(SID==='19891013'&&(!x.owner||x.name==='オワリ'))rf.update({owner:true,name:x.name==='オワリ'?'チーズステーキ':x.name}).catch(()=>{});else if(x.owner&&x.name==='オワリ')rf.update({owner:false}).catch(()=>{})}else if(SID&&!s.metadata.fromCache&&s.docs.length){const sid=SID;raw.doc('stores/'+sid).get().then(d=>{if(!d.exists&&SID===sid)leaveStore()}).catch(()=>{})}refresh()},()=>{});
  if(JOIN){await joinInvite(JOIN[0],JOIN[1]);return}
  if(PLINK){await plinkEnter(PLINK[0],PLINK[1],PLINK[2]);return}
  if(SID){const g=await gate(SID);if(g.st==='ok'){V='home';attach();render()}else if(g.st==='none'){V='setup';render()}else if(g.st==='offline'){KICK=stMsg('offline');V='kicked';render()}else kickOut(stMsg(g.st),g.st!=='blk')}
})();
